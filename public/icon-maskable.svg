<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background covering 100% of view for maskable capability -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  
  <!-- Content scaled and centered inside the 80% safe zone -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Grid Lines -->
    <g stroke="#334155" stroke-width="3" stroke-dasharray="8 8" opacity="0.6">
      <line x1="80" y1="160" x2="432" y2="160" />
      <line x1="80" y1="280" x2="432" y2="280" />
      <line x1="80" y1="400" x2="432" y2="400" />
      <line x1="160" y1="80" x2="160" y2="432" />
      <line x1="280" y1="80" x2="280" y2="432" />
      <line x1="400" y1="80" x2="400" y2="432" />
    </g>
    
    <!-- Highlighted Land Plot Area -->
    <rect x="280" y="160" width="120" height="120" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="4" />
    
    <!-- Location Pin -->
    <g filter="url(#shadow)">
      <path d="M256,80 C170,80 100,150 100,236 C100,340 256,448 256,448 C256,448 412,340 412,236 C412,150 342,80 256,80 Z" fill="url(#pinGrad)" />
      <circle cx="256" cy="220" r="54" fill="#ffffff" />
      <rect x="232" y="196" width="48" height="48" rx="8" fill="#10b981" />
      <path d="M224,220 L256,188 L288,220" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
